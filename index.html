<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 1인 1역할 배정판</title>

  <!-- 웹 폰트 (Jua & Pretendard CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- 꽃가루(Confetti) 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* 파스텔 민트 & 코랄 테마 */
      --mint-main: #0ca678;
      --mint-light: #e6fcf5;
      --mint-hover: #099268;
      --coral-main: #ff6b6b;
      --coral-light: #ffe3e3;
      --coral-hover: #fa5252;
      
      --bg-canvas: #f2faf7;
      --card-bg: #ffffff;
      --text-dark: #2b2d42;
      --text-sub: #636e72;
      --border-color: #d3f9d8;
      --shadow-sm: 0 4px 12px rgba(12, 166, 120, 0.08);
      --shadow-lg: 0 12px 28px rgba(12, 166, 120, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-dark);
      padding: 24px 16px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1180px;
    }

    /* 상단 헤더 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .main-title {
      font-family: 'Jua', sans-serif;
      font-size: clamp(2.3rem, 5vw, 3.3rem);
      color: var(--mint-main);
      text-shadow: 2px 2px 0px #c3fae8;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .main-title .highlight-coral {
      color: var(--coral-main);
      text-shadow: 2px 2px 0px #ffe3e3;
    }

    .sub-title {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 500;
    }

    /* 입력 영역 카드 */
    .input-board {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow-sm);
      border: 2px solid var(--border-color);
      margin-bottom: 20px;
    }

    .columns-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .columns-wrap {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.4rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-count {
      background-color: var(--mint-light);
      color: var(--mint-hover);
      font-size: 0.95rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid #c3fae8;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid #e2f0ea;
      background-color: #fafdff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.15rem;
      line-height: 1.65;
      color: #333;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      border-color: var(--mint-main);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(12, 166, 120, 0.12);
    }

    /* 📌 사전 고정 핀(Pre-assignment) 영역 */
    .pin-board {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 24px;
      border: 2px dashed #99e9f2;
      box-shadow: var(--shadow-sm);
      margin-bottom: 26px;
    }

    .pin-board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pin-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #0b7285;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pin-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .pin-form-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .pin-input {
      padding: 10px 14px;
      border: 1.5px solid #c5f6fa;
      background: #f8fdfe;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #2b2d42;
      outline: none;
      flex: 1;
      min-width: 170px;
    }

    .pin-input:focus {
      border-color: #22b8cf;
      background: #fff;
    }

    .btn-pin-add {
      background-color: #22b8cf;
      color: #fff;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-pin-add:hover {
      background-color: #15aabf;
      transform: translateY(-1px);
    }

    .pinned-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pin-tag {
      background: var(--coral-light);
      color: #c92a2a;
      border: 1.5px solid #ffc9c9;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.98rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: popIn 0.25s ease-out;
    }

    .pin-tag button {
      background: transparent;
      border: none;
      color: #e03131;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 배정 액션 버튼 */
    .action-area {
      text-align: center;
      margin: 10px 0 35px;
    }

    .btn-assign {
      font-family: 'Jua', sans-serif;
      font-size: clamp(1.6rem, 3.8vw, 2.2rem);
      padding: 16px 48px;
      background: linear-gradient(135deg, var(--mint-main) 0%, var(--coral-main) 100%);
      color: #ffffff;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 107, 107, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .btn-assign:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 30px rgba(255, 107, 107, 0.45);
    }

    .btn-assign:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--coral-hover);
      background-color: var(--coral-light);
      padding: 10px 22px;
      border-radius: 30px;
      display: inline-block;
      margin-top: 16px;
      border: 1px solid #ffc9c9;
    }

    /* 결과 카드 영역 */
    .result-section {
      display: none;
      width: 100%;
    }

    .result-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .result-heading {
      font-family: 'Jua', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      color: var(--mint-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .print-date {
      display: none; /* 화면에선 숨기고 인쇄 시 표시 */
      font-size: 1.1rem;
      color: #555;
    }

    /* 🖨️ A4 교실 인쇄 버튼 */
    .btn-print {
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      background: #ffffff;
      color: var(--coral-main);
      border: 2.5px solid var(--coral-main);
      padding: 10px 24px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.15);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-print:hover {
      background: var(--coral-main);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* 카드 그리드 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    /* 학생 역할 카드 디자인 */
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 20px;
      border: 2.5px solid #d3f9d8;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s;
    }

    .match-card.is-pinned {
      border: 2.5px solid #ffc9c9;
      background: linear-gradient(180deg, #ffffff 0%, #fffbfb 100%);
    }

    .card-badges {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pin-badge {
      background: var(--coral-main);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .card-num {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #adb5bd;
    }

    .student-badge-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .student-icon {
      font-size: 1.5rem;
    }

    .student-name {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      color: #2b2d42;
      line-height: 1.15;
    }

    /* 역할 뱃지 & 슬롯머신 텍스트 애니메이션 */
    .role-badge {
      font-size: 1.3rem;
      font-weight: 800;
      padding: 12px 14px;
      border-radius: 14px;
      text-align: center;
      letter-spacing: -0.3px;
      transition: all 0.15s ease;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 롤링 중 블러 및 깜빡임 효과 */
    .rolling-text {
      color: #868e96 !important;
      background: #f1f3f5 !important;
      border: 2px dashed #ced4da !important;
      filter: blur(0.6px);
      transform: scale(0.97);
    }

    /* 파스텔 민트/코랄 카드 색상 베리에이션 */
    .color-mint {
      background-color: var(--mint-light);
      color: var(--mint-hover);
      border: 2px solid #b2f2bb;
    }
    .color-coral {
      background-color: var(--coral-light);
      color: #d6336c;
      border: 2px solid #ffc9c9;
    }
    .color-sky {
      background-color: #e7f5ff;
      color: #1971c2;
      border: 2px solid #a5d8ff;
    }
    .color-yellow {
      background-color: #fff9db;
      color: #f08c00;
      border: 2px solid #ffec99;
    }

    /* 🖨️ A4 단면 인쇄 최적화 스타일 (교실 게시용) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 10mm;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        color: #000000 !important;
      }

      .container {
        max-width: 100% !important;
        width: 100% !important;
      }

      /* 불필요한 입력 및 조작 컨트롤 숨김 */
      header .sub-title,
      .input-board,
      .pin-board,
      .action-area,
      .btn-print {
        display: none !important;
      }

      .result-section {
        display: block !important;
      }

      .result-top-bar {
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      .result-heading {
        color: #000 !important;
        font-size: 2rem !important;
      }

      .print-date {
        display: inline-block !important;
        font-size: 1.1rem;
        font-weight: bold;
      }

      /* A4 3열 배열 */
      .card-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 12px !important;
      }

      .match-card {
        border: 1.5px solid #333 !important;
        box-shadow: none !important;
        padding: 14px 12px !important;
        page-break-inside: avoid;
        background: #ffffff !important;
      }

      .student-name {
        font-size: 1.6rem !important;
        color: #000 !important;
      }

      .role-badge {
        font-size: 1.1rem !important;
        border: 1px solid #333 !important;
        background: #f8f9fa !important;
        color: #000 !important;
        padding: 8px !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 -->
    <header>
      <h1 class="main-title">
        <span>🌿 우리 반</span>
        <span class="highlight-coral">1인 1역할 배정판</span>
      </h1>
      <p class="sub-title">모두가 주인이 되어 즐겁게 협동하는 우리 교실 🏫</p>
    </header>

    <!-- 1. 학생/역할 입력란 (왼쪽/오른쪽) -->
    <section class="input-board">
      <div class="columns-wrap">
        
        <!-- 왼쪽: 학생 명단 -->
        <div class="input-group">
          <div class="input-header">
            <span class="input-title">👦👧 학생 명단</span>
            <span class="badge-count" id="studentCount">총 10명</span>
          </div>
          <textarea id="studentsInput" placeholder="학생 이름을 줄바꿈(엔터)으로 입력하세요">김민준
이서아
박도윤
최지우
정예준
강하은
윤지호
임수아
한서준
오은우</textarea>
        </div>

        <!-- 오른쪽: 역할 명단 -->
        <div class="input-group">
          <div class="input-header">
            <span class="input-title">📋 학급 역할 목록</span>
            <span class="badge-count" id="roleCount">총 10개</span>
          </div>
          <textarea id="rolesInput" placeholder="역할을 줄바꿈(엔터)으로 입력하세요">칠판 지우기
우유 급식 당번
분리수거 도우미
창문 환기 지킴이
에너지 절약 요원
줄반장 (급식 지도)
학급 문고 도서 정리
알림장 판서 확인
컴퓨터/TV 도우미
선생님 심부름 도우미</textarea>
        </div>

      </div>
    </section>

    <!-- 2. 사전 고정 핀(Pin) 기능 -->
    <section class="pin-board">
      <div class="pin-board-header">
        <span class="pin-title">📌 역할 사전 고정 핀 (선택 사항)</span>
        <span class="pin-desc">특정 학생에게 역할을 먼저 지정하고 나머지 학생만 랜덤 배정합니다.</span>
      </div>

      <div class="pin-form-wrap">
        <input type="text" id="pinStudentInput" class="pin-input" placeholder="학생 이름 (예: 김민준)" list="studentDataList">
        <datalist id="studentDataList"></datalist>

        <span style="font-weight: bold; color: var(--text-sub);">➔</span>

        <input type="text" id="pinRoleInput" class="pin-input" placeholder="배정할 역할 (예: 칠판 지우기)" list="roleDataList">
        <datalist id="roleDataList"></datalist>

        <button type="button" id="btnAddPin" class="btn-pin-add">📌 고정 핀 꽂기</button>
      </div>

      <div class="pinned-list" id="pinnedList"></div>
    </section>

    <!-- 3. 중앙 액션 버튼 -->
    <div class="action-area">
      <button class="btn-assign" id="assignBtn">
        <span id="assignIcon">🎲</span>
        <span id="assignText">역할 랜덤 배정하기!</span>
      </button>
      <br>
      <div id="statusNotice" style="display: none;" class="status-msg"></div>
    </div>

    <!-- 4. 배정 결과 카드 & 출력 영역 -->
    <section class="result-section" id="resultSection">
      <div class="result-top-bar">
        <h2 class="result-heading">🎉 1인 1역할 배정 결과표</h2>
        <span class="print-date" id="printDate"></span>
        <button class="btn-print" onclick="window.print()">🖨️ A4 교실 인쇄하기</button>
      </div>
      <div class="card-grid" id="cardGrid"></div>
    </section>
  </div>

  <script>
    // DOM 요소 캐싱
    const studentsInput = document.getElementById('studentsInput');
    const rolesInput = document.getElementById('rolesInput');
    const studentCount = document.getElementById('studentCount');
    const roleCount = document.getElementById('roleCount');
    const studentDataList = document.getElementById('studentDataList');
    const roleDataList = document.getElementById('roleDataList');

    const pinStudentInput = document.getElementById('pinStudentInput');
    const pinRoleInput = document.getElementById('pinRoleInput');
    const btnAddPin = document.getElementById('btnAddPin');
    const pinnedList = document.getElementById('pinnedList');

    const assignBtn = document.getElementById('assignBtn');
    const assignIcon = document.getElementById('assignIcon');
    const assignText = document.getElementById('assignText');
    const statusNotice = document.getElementById('statusNotice');

    const resultSection = document.getElementById('resultSection');
    const cardGrid = document.getElementById('cardGrid');
    const printDate = document.getElementById('printDate');

    // 사전 고정 목록: [{ student: '김민준', role: '칠판 지우기' }]
    let pinnedPairs = [];

    // 줄바꿈 텍스트 파싱
    function parseLines(text) {
      return text.split('\n')
                 .map(line => line.trim())
                 .filter(line => line.length > 0);
    }

    // 카운트 및 자동완성(Datalist) 갱신
    function updateCountsAndLists() {
      const students = parseLines(studentsInput.value);
      const roles = parseLines(rolesInput.value);

      studentCount.textContent = `총 ${students.length}명`;
      roleCount.textContent = `총 ${roles.length}개`;

      // Datalist 갱신
      studentDataList.innerHTML = students.map(s => `<option value="${s}">`).join('');
      roleDataList.innerHTML = roles.map(r => `<option value="${r}">`).join('');
    }

    studentsInput.addEventListener('input', updateCountsAndLists);
    rolesInput.addEventListener('input', updateCountsAndLists);
    updateCountsAndLists();

    // 핀 렌더링
    function renderPinnedList() {
      pinnedList.innerHTML = '';
      pinnedPairs.forEach((pair, index) => {
        const tag = document.createElement('div');
        tag.className = 'pin-tag';
        tag.innerHTML = `
          <span>📌 <b>${pair.student}</b> ➔ ${pair.role}</span>
          <button type="button" onclick="removePin(${index})" title="고정 해제">&times;</button>
        `;
        pinnedList.appendChild(tag);
      });
    }

    // 핀 추가
    btnAddPin.addEventListener('click', () => {
      const sVal = pinStudentInput.value.trim();
      const rVal = pinRoleInput.value.trim();

      if (!sVal || !rVal) {
        alert('학생 이름과 역할을 모두 입력해 주세요!');
        return;
      }

      // 중복 체크
      if (pinnedPairs.some(p => p.student === sVal)) {
        alert(`'${sVal}' 학생은 이미 역할이 고정되어 있습니다.`);
        return;
      }
      if (pinnedPairs.some(p => p.role === rVal)) {
        alert(`'${rVal}' 역할은 이미 다른 학생에게 고정되어 있습니다.`);
        return;
      }

      pinnedPairs.push({ student: sVal, role: rVal });
      renderPinnedList();

      pinStudentInput.value = '';
      pinRoleInput.value = '';
      pinStudentInput.focus();
    });

    // 핀 제거 함수
    window.removePin = function(idx) {
      pinnedPairs.splice(idx, 1);
      renderPinnedList();
    };

    // Fisher-Yates 셔플 알고리즘
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Web Audio API 사운드 효과 (두구두구 틱 & 축하 팡파레)
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTickSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.04);

        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch (e) {}
    }

    function playSuccessChime() {
      try {
        const ctx = getAudioContext();
        const freqs = [261.63, 329.63, 392.00, 523.25, 659.25]; // 도-미-솔-도-미
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);

          const start = ctx.currentTime + idx * 0.08;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.4);
        });
      } catch (e) {}
    }

    // 축하 꽃가루(Confetti) 폭죽 효과
    function triggerConfettiBurst() {
      if (typeof confetti !== 'function') return;

      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#0ca678', '#20c997', '#ff6b6b'] });
      fire(0.2, { spread: 60, colors: ['#ffa8a8', '#63e6be', '#ffd43b'] });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#ff8787', '#38d9a9'] });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    // 색상 클래스 배열
    const badgeColors = ['color-mint', 'color-coral', 'color-sky', 'color-yellow'];

    // 배정 시작 버튼 이벤트
    assignBtn.addEventListener('click', () => {
      const allStudents = parseLines(studentsInput.value);
      const allRoles = parseLines(rolesInput.value);

      if (allStudents.length === 0) {
        alert('학생 명단을 1명 이상 입력해 주세요!');
        studentsInput.focus();
        return;
      }
      if (allRoles.length === 0) {
        alert('역할 목록을 1개 이상 입력해 주세요!');
        rolesInput.focus();
        return;
      }

      // 고정 핀 유효성 검사 (목록에 실제로 존재하는지 확인 및 처리)
      const validPins = pinnedPairs.filter(p => allStudents.includes(p.student));
      
      // 고정되지 않은 나머지 학생 & 역할 목록 추출
      const unpinnedStudents = allStudents.filter(s => !validPins.some(p => p.student === s));
      const unpinnedRoles = allRoles.filter(r => !validPins.some(p => p.role === r));

      // 안내 문구
      statusNotice.style.display = 'none';
      if (allStudents.length > allRoles.length) {
        statusNotice.textContent = `⚠️ 학생 수(${allStudents.length}명)가 역할 수(${allRoles.length}개)보다 많아 일부 학생은 '자율 활동 도우미'로 배정됩니다.`;
        statusNotice.style.display = 'inline-block';
      } else if (allStudents.length < allRoles.length) {
        statusNotice.textContent = `💡 역할 수(${allRoles.length}개)가 학생 수(${allStudents.length}명)보다 많아 일부 역할은 남습니다.`;
        statusNotice.style.display = 'inline-block';
      }

      // 셔플 및 최종 결과 리스트 구성
      const shuffledRestStudents = shuffle(unpinnedStudents);
      const shuffledRestRoles = shuffle(unpinnedRoles);

      // 최종 매칭 리스트 생성: [{ student, role, isPinned }]
      const finalMatches = [];

      // 1. 사전 고정 대상자 우선 배치
      validPins.forEach(p => {
        finalMatches.push({ student: p.student, role: p.role, isPinned: true });
      });

      // 2. 나머지 학생 1:1 매칭
      shuffledRestStudents.forEach((student, idx) => {
        const assignedRole = shuffledRestRoles[idx] || '🌟 자율 활동 도우미';
        finalMatches.push({ student, role: assignedRole, isPinned: false });
      });

      // 인쇄 날짜 업데이트
      const now = new Date();
      printDate.textContent = `(배정 일시: ${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()})`;

      // 결과 화면 보이기 및 스크롤
      resultSection.style.display = 'block';
      cardGrid.innerHTML = '';

      // 슬롯머신 대기 상태 카드 렌더링
      const cardElements = [];
      finalMatches.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `match-card ${item.isPinned ? 'is-pinned' : ''}`;

        const colorClass = badgeColors[index % badgeColors.length];

        card.innerHTML = `
          <div class="card-badges">
            ${item.isPinned ? '<span class="pin-badge">📌 사전 지정</span>' : ''}
            <span class="card-num">#${index + 1}</span>
          </div>
          <div class="student-badge-wrap">
            <span class="student-icon">🌱</span>
            <div class="student-name">${item.student}</div>
          </div>
          <div class="role-badge rolling-text" id="roleText_${index}">
            ${item.isPinned ? item.role : '🎰 두구두구...'}
          </div>
        `;

        cardGrid.appendChild(card);
        cardElements.push({
          element: card.querySelector(`#roleText_${index}`),
          finalRole: item.role,
          isPinned: item.isPinned,
          colorClass: colorClass
        });
      });

      // 결과창으로 스크롤 이동
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 2초 동안 두구두구 슬롯머신 롤링 애니메이션
      assignBtn.disabled = true;
      assignIcon.textContent = '🎰';
      assignText.textContent = '두구두구 섞는 중...';

      const candidateRolePool = allRoles.length > 0 ? allRoles : ['모둠 도우미', '정리 정돈', '창문 환기'];
      const startTime = Date.now();
      const rollingDuration = 2000; // 정확히 2초간 회전

      const rollInterval = setInterval(() => {
        playTickSound();

        // 핀으로 고정되지 않은 카드들의 텍스트를 빠르게 무작위 교체
        cardElements.forEach(item => {
          if (!item.isPinned) {
            const randomRole = candidateRolePool[Math.floor(Math.random() * candidateRolePool.length)];
            item.element.textContent = randomRole;
          }
        });

        // 2초 경과 시 종료
        if (Date.now() - startTime >= rollingDuration) {
          clearInterval(rollInterval);

          // 최종 역할 고정 & 스타일 복구
          cardElements.forEach(item => {
            item.element.classList.remove('rolling-text');
            item.element.classList.add(item.colorClass);
            item.element.textContent = item.finalRole;
          });

          // 성공음 & Confetti 폭죽 효과 터뜨리기!
          playSuccessChime();
          triggerConfettiBurst();

          // 버튼 원상 복구
          assignBtn.disabled = false;
          assignIcon.textContent = '🎲';
          assignText.textContent = '다시 랜덤 배정하기!';
        }
      }, 70); // 70ms 주기로 빠른 롤링
    });
  </script>
</body>
